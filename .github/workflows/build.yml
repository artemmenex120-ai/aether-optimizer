name: Build and validate
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'
      - name: Validate metadata JSON
        run: python -c "import json; [json.load(open(p, encoding='utf-8')) for p in ('src/main/resources/fabric.mod.json', 'src/main/resources/aether_optimizer.mixins.json')]"
      - name: Unit tests
        run: gradle test --no-daemon --stacktrace
      - name: Build remapped mod and sources
        run: gradle build --no-daemon --stacktrace
      - name: Generate SHA-256 checksums
        run: sha256sum build/libs/*.jar > build/libs/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: aether-optimizer-0.33.0-minecraft-26.2
          path: |
            build/libs/*.jar
            build/libs/SHA256SUMS.txt
          if-no-files-found: error
